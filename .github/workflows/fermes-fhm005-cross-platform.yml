name: Fermes FHM-005 Cross-Platform Source Checks

on:
  pull_request:
    paths:
      - '.github/workflows/fermes-fhm005-cross-platform.yml'
      - 'agent/trusted_verifier_*'
      - 'tests/agent/test_trusted_verifier_*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fhm005-source-tests:
    name: FHM-005 source tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-26.04'
          - 'windows-2025'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.13.3'
          enable-cache: false
      - name: Install locked development and test dependencies
        run: uv sync --locked --python 3.14 --group dev --group test --no-install-project
      - name: Require the complete source-only FHM-005 suite
        shell: pwsh
        run: |
          $testFiles = @(
            'tests/agent/test_trusted_verifier_controller_protocol.py',
            'tests/agent/test_trusted_verifier_controller_service.py',
            'tests/agent/test_trusted_verifier_windows_controller_service.py',
            'tests/agent/test_trusted_verifier_native_peer_probe.py',
            'tests/agent/test_trusted_verifier_handshake_model.py',
            'tests/agent/test_trusted_verifier_contract.py',
            'tests/agent/test_trusted_verifier_attempt.py',
            'tests/agent/test_trusted_verifier_receipt_store.py'
          )
          foreach ($file in $testFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required FHM-005 source test is missing: $file"
            }
          }
          uv run --no-sync python -m pytest -q -p no:cacheprovider $testFiles
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Ruff lint and format checks
        shell: pwsh
        run: |
          $files = @(
            'agent/trusted_verifier_controller_protocol.py',
            'agent/trusted_verifier_controller_service.py',
            'agent/trusted_verifier_windows_controller_service.py',
            'agent/trusted_verifier_handshake_model.py',
            'tests/agent/test_trusted_verifier_controller_protocol.py',
            'tests/agent/test_trusted_verifier_controller_service.py',
            'tests/agent/test_trusted_verifier_windows_controller_service.py',
            'tests/agent/test_trusted_verifier_native_peer_probe.py',
            'tests/agent/test_trusted_verifier_handshake_model.py'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required FHM-005 source file is missing: $file"
            }
          }
          uv run --no-sync ruff check $files
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          uv run --no-sync ruff format --check $files
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Windows Server 2025 checks OS-family compatibility only. Native
      # Windows 11 Pro x64 security qualification remains separate and requires
      # owner approval for any privileged services involved.
