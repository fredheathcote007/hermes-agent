# FHM-007 fork-only CI: no Blacksmith runners or publish credentials.
name: Fermes FHM-007 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fermes-fhm007-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  memory-v2:
    name: Fermes memory v2 focused checks
    if: github.repository == 'fredheathcote007/hermes-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout PR code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.13.3'
          enable-cache: true
      - name: Install locked test dependencies
        run: uv sync --locked --python 3.14 --group dev --group test --no-install-project
      - name: Ruff lint and formatting
        run: |
          .venv/bin/ruff check agent/memory_v2_store.py tests/agent/test_memory_v2_store.py
          .venv/bin/ruff format --check agent/memory_v2_store.py tests/agent/test_memory_v2_store.py
      - name: Memory v2 isolated unit tests
        env:
          HERMES_HOME: ${{ runner.temp }}/fermes-memory-v2-test-home
        run: |
          .venv/bin/python -m pytest -p no:cacheprovider -q --maxfail=1 tests/agent/test_memory_v2_store.py
